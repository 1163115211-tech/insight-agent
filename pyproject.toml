[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insight-agent"
version = "0.1.0"
description = "问数 Insight Agent — 自然语言数据分析 Agent（LangGraph + DeepSeek）"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.2,<2",
    "langchain-openai>=1.1,<2",
    "langgraph>=1.1,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sse-starlette>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
insight = "insight.cli:app"

[tool.setuptools]
packages = ["insight", "insight.db", "insight.eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
